
name: Black US Code - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify project structure
        run: |
          test -f PRD.yml
          test -f server/core.py
          test -d registry
          test -d tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
