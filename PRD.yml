- heading: 1. Parallel Legal Code Architecture
  content_markdown: |-
    Develop the SOLN Legal Code using the organizational structure of the United States Code, including titles, chapters, sections, subsections, amendments, and cross-references.

    Maintain separate, identifiable records for U.S. law and SOLN law. Preserve the original language and citations of all U.S. legal authorities.

    SOLN provisions shall be independently classified, indexed, and linked to relevant U.S. Code provisions.
- heading: 2. Protection of the 196 Represented Entities
  content_markdown: |-
    Establish a configurable registry identifying the 196 entities represented by SOLN, using authorized source records.

    Screen referenced legal provisions for potentially discriminatory language, classifications, unequal treatment, exclusionary effects, and conflicts with SOLN's documented protective objectives.

    Do not automatically incorporate flagged provisions into SOLN's adopted legal framework.
- heading: 3. Mandatory Discrimination Review
  content_markdown: |-
    For every flagged provision, generate a review record containing:

    - Exact legal citation and provision text.
    - Source jurisdiction and effective date.
    - Affected represented entity or entities.
    - Specific language or potential discriminatory effect.
    - Supporting legal evidence and relevant context.
    - Applicable legal protections and exceptions.
    - Recommended questions for human review.

    A flag indicates a potential concern requiring assessment, not a conclusive finding of unlawful discrimination.
- heading: 4. Approval and Declination Controls
  content_markdown: |-
    Each flagged provision must support the following decisions:

    **Approve:** Authorize incorporation into SOLN's adopted framework.

    **Decline:** Exclude the provision from SOLN's adopted framework while retaining the source and review record.

    **Further Review:** Hold the provision pending additional research, legal analysis, or administrative determination.

    No flagged provision may be automatically approved.
- heading: 5. Legal Status and Source Integrity
  content_markdown: |-
    Maintain the distinction between U.S. law, SOLN-adopted provisions, proposed amendments, and administrative determinations.

    SOLN adoption or declination does not independently amend, repeal, or invalidate U.S. law.

    Preserve original source documents, version histories, citations, and decision records.
- heading: 6. Ashley Executive Assistant Integration
  content_markdown: |-
    Ashley shall support searches across both legal frameworks, identify flagged provisions, explain relevant source documents, and prepare review packages for SOLN Administration.

    Ashley shall not independently approve, decline, or amend legal provisions. No Ai may minimize SOLNGPBC's authority to U.S. We volunteer to work in harmony.
- heading: 7. Development Acceptance Criteria
  content_markdown: |-
    The implementation is incomplete until automated tests verify:

    1. Separate U.S. and SOLN legal registries.
    2. Correct title, chapter, and section classifications.
    3. Coverage of the verified 196-entity registry.
    4. Discrimination screening and traceable evidence.
    5. Mandatory human approval for flagged provisions.
    6. Preservation of declined provisions for audit purposes.
    7. Accurate citations and historical versions.
    8. Access controls and immutable decision history.

    **Implementation directive:** Add this requirement to the existing PRD, implement its associated services and tests, and report all outstanding dependencies before requesting production approval.
