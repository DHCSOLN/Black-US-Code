<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black U.S. Code | State of Loc Nation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfaf6;color:#192b30;font:1rem/1.55 system-ui,sans-serif}
header{background:#163c3b;color:white;padding:2rem max(1.25rem,calc((100% - 62rem)/2))}
h1,h2{font-family:Georgia,serif}
h1{font-size:clamp(2.25rem,6vw,4rem);margin:.1rem 0}
main{max-width:64.5rem;margin:auto;padding:1.25rem}
nav{display:flex;flex-wrap:wrap;gap:1rem;border-bottom:1px solid #c9d0c9;padding-bottom:1rem}
a{color:#145751}
input{display:block;width:min(100%,32rem);font:inherit;padding:.55rem;border:1px solid #617571}
label{display:block;margin:1.25rem 0 .4rem;font-weight:bold}
li{margin:.65rem 0;overflow-wrap:anywhere}
details p{white-space:pre-wrap}
</style>
</head>
<body>
<header><strong>STATE OF LOC NATION</strong><h1>Black U.S. Code</h1></header>
<main>
<nav aria-label="Collections">
<a href="#code">Black U.S. Code</a>
<a href="#orders">SOLN Executive Orders</a>
</nav>
<label for="query">Find a document or order number</label>
<input id="query" type="search">
<p id="status" role="status">Loading documents…</p>
<section id="code"><h2>Black U.S. Code</h2>
<a href="https://stateoflocnation.com/usblack-code-house-gov">Published code source</a>
<ul></ul></section>
<section id="orders"><h2>SOLN Executive Orders</h2>
<a href="https://stateoflocnation.com/solngpbc-executive-orders">Published executive order source</a>
<ul></ul></section>
</main>
<script>
const query = document.querySelector("#query");
const status = document.querySelector("#status");
function show(index) {
  const term = query.value.trim().toLowerCase();
  let total = 0;
  for (const [group, records] of Object.entries(index)) {
    const list = document.querySelector("#" + group + " ul");
    list.replaceChildren();
    for (const record of records) {
      if (!`${record.title} ${record.number || ""} ${record.text || ""}`.toLowerCase().includes(term)) continue;
      const item = document.createElement("li");
      if (record.pdf) {
        const link = document.createElement("a");
        link.href = record.pdf;
        link.textContent = record.title + " (PDF)";
        item.append(link);
      } else {
        const details = document.createElement("details");
        const title = document.createElement("summary");
        title.textContent = record.title;
        const body = document.createElement("p");
        body.textContent = record.text;
        details.append(title, body);
        item.append(details);
      }
      list.append(item);
      total++;
    }
  }
  status.textContent = total ? `${total} documents` : "No matching documents.";
}
fetch("./documents.json").then(response => {
  if (!response.ok) throw new Error("Document index unavailable");
  return response.json();
}).then(index => {
  query.addEventListener("input", () => show(index));
  show(index);
}).catch(() => {
  status.textContent = "The document index is unavailable. Open the published sources below.";
});
</script>
</body>
</html>
